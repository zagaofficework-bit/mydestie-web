version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placefinder_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=localhost
      - DB_USER=root
      - DB_PASSWORD=""
      - DB_NAME=database
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: placefinder_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: database
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Automatically imports your database schema on first container startup:
      - ./install/database.sql:/docker-entrypoint-initdb.d/database.sql

volumes:
  db_data: